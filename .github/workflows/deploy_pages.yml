name: Auto-Update Short Put Terminal on GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # 自动定时更新（北京时间 06:00 美股收盘、12:00 午盘、15:40 A股/国内期货日盘收盘、22:30 美股开盘/夜盘）
    - cron: "0 22 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "40 7 * * 1-5"
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-live-site:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      FORCE_REFRESH: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest market quotes & build full interactive terminal
        run: python build_hf_static.py

      - name: Publish updated terminal to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd huggingface_static
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add index.html .nojekyll
          git commit -m "Auto-update Short Put Terminal ($(date '+%Y-%m-%d %H:%M:%S CST'))"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
